name: SDR Radio Recorder
version: "0.3.0"
slug: sdr_recorder
description: Receive-only multi-channel NFM recorder with an Ingress library
url: https://github.com/timmchugh11/rtl-sdr-recorder--Home-Assistant
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:radio-tower
panel_title: SDR Recorder
homeassistant_api: true
usb: true
map:
  - type: media
    read_only: false
options:
  source: pluto
  uri: "usb:"
schema:
  source: list(pluto|mock)
  uri: str
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct web access (Ingress is preferred)
watchdog: http://[HOST]:[PORT:8099]/health
